[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stad"
version = "2.0.0"
description = "Student-teacher knowledge distillation for image anomaly detection"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Akhrorjon Akhmadjon Ugli Rakhmonov" }]
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "timm>=1.0.11",
    "numpy>=1.26",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "opencv-python>=4.9",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "matplotlib>=3.7",
    "tensorboard>=2.15",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# PatchCore baseline comparison; heavy (pulls in lightning and friends).
baselines = ["anomalib>=1.1"]

[project.scripts]
stad-train = "stad.cli.train:main"
stad-test = "stad.cli.test:main"
stad-score = "stad.cli.score:main"
stad-cache-teacher = "stad.cli.cache_teacher:main"
stad-patchcore = "stad.cli.baseline_patchcore:main"

[tool.setuptools.packages.find]
include = ["stad*"]
