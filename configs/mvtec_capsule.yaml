experiment_name: mvtec_capsule
output_dir: ./outputs
device: auto
seed: 42

data:
  dataset_name: mvtec
  data_root: ./data
  normal_class: capsule
  val_fraction: 0.1
  num_workers: 4
  mvtec_img_size: 256

teacher:
  kind: vgg16
  pretrained: true
  feature_layers: [3, 6, 9, 12]

student:
  equal_size: false
  use_bias: false

train:
  num_epochs: 600
  batch_size: 16
  learning_rate: 1.0e-3
  weight_decay: 0.0
  lamda: 0.5
  direction_loss_only: false
  amp: true
  cache_teacher: true
  resume: null
  log_every: 10
  val_every: 5
  ckpt_every: 50

eval:
  localization: true
  localization_method: feature_dist
  smooth_grad_n: 25
  smooth_grad_sigma: 0.05
