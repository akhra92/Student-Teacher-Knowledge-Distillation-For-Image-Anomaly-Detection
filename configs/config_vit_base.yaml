# =====================================================================
# Student-Teacher Anomaly Detection — bigger ViT teacher benchmark
# DINOv2 ViT-Base (768-dim, depth 12) on MNIST. Compare AUROC against the
# ViT-Small teacher (config.yaml).
# =====================================================================

experiment_name: mnist_vit_base
output_dir: ./outputs
device: cuda                # auto | cuda | mps | cpu
seed: 42

# ---------- Data ----------
data:
  dataset_name: mnist       # mnist | fashionmnist | cifar10 | mvtec
  data_root: ./data
  normal_class: 3           # int for mnist/fmnist/cifar10; str (e.g. "capsule") for mvtec
  val_fraction: 0.1         # carve val out of train (anti-leakage)
  num_workers: 4
  mvtec_img_size: 256
  vit_img_size: 224         # mnist/fmnist input size for the timm/ViT teacher only; 224 = 16×14 patches

# ---------- Networks ----------
teacher:
  kind: timm                                     # timm
  pretrained: true
  timm_model: vit_base_patch14_dinov2.lvd142m    # bigger teacher: 768-dim, depth 12, patch 14
  feature_layers: [2, 5, 8, 11]                  # ViT block indices (base is depth 12, so 0..11)

student:
  mlp_ratio: 3.0            # student auto-matches the base teacher's 768-dim width; teacher mlp_ratio is 4.0

# ---------- Training ----------
train:
  num_epochs: 200           # longer than the 51-epoch default: the from-scratch (now wider) student needs it
  batch_size: 32
  learning_rate: 1.0e-3
  weight_decay: 0.0
  lamda: 0.05               # mvtec:0.5, others:0.05
  direction_loss_only: false
  cache_teacher: false      # pre-compute teacher features (memory-heavy but fast; disables train shuffling)
  resume: null              # checkpoint to resume from (restores weights + optimizer + epoch)
  log_every: 10
  val_every: 1              # epochs between validation runs
  ckpt_every: 50            # epochs between periodic checkpoints

# ---------- Evaluation ----------
eval:
  localization: false                # true → pixel-level (mvtec only)
  localization_method: feature_dist  # feature_dist
