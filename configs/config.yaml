# =====================================================================
# Student-Teacher Anomaly Detection — Configuration
# =====================================================================

experiment_name: mvtec_bottle
output_dir: ./outputs
device: cuda                # auto | cuda | mps | cpu
seed: 42

# ---------- Data ----------
data:
  dataset_name: mvtec       # mnist | fashionmnist | cifar10 | mvtec
  data_root: ./data
  normal_class: "bottle"           # int for mnist/fmnist/cifar10; str (e.g. "capsule") for mvtec
  val_fraction: 0.1         # carve val out of train (anti-leakage)
  num_workers: 4
  mvtec_img_size: 256
  vit_img_size: 224         # mnist/fmnist input size for the ViT teacher; 224 = 16×14 patches

# ---------- Networks ----------
teacher:
  kind: timm               # timm
  pretrained: true
  timm_model: vit_small_patch14_dinov2.lvd142m
  feature_layers: [2, 5, 8, 11]               # ViT block indices (small is depth 12, so 0..11)

student:
  mlp_ratio: 2.0            # ViT student capacity (teacher uses 4.0); lower = tighter anomaly bottleneck

# ---------- Training ----------
train:
  num_epochs: 601            # mnist/fmnist:51, cifar10:201, mvtec:601
  batch_size: 32
  learning_rate: 1.0e-3
  weight_decay: 0.0
  lamda: 0.5               # mvtec:0.5, others:0.05
  direction_loss_only: false
  cache_teacher: false      # pre-compute teacher features (memory-heavy but fast)
  resume: null              # path to checkpoint to resume from
  log_every: 10
  val_every: 1              # epochs between validation runs
  ckpt_every: 50            # epochs between periodic checkpoints

# ---------- Evaluation ----------
eval:
  localization: false                # true → pixel-level (mvtec only)
  localization_method: feature_dist  # feature_dist
